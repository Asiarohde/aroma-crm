name: Strona i codzienne News

on:
  push:
    branches: [main]
  schedule:
    # 05:00 UTC to 07:00 latem i 06:00 zimą w Polsce, czyli przed 9:00
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Pobierz nowe News (PubMed i Instytut Aromaterapii)
        if: github.event_name != 'push'
        continue-on-error: true
        run: node scripts/fetch-news.mjs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Zapisz news.json w repozytorium
        if: github.event_name != 'push'
        run: |
          git config user.name "aroma-crm-bot"
          git config user.email "actions@users.noreply.github.com"
          git add news.json
          git diff --cached --quiet || (git commit -m "News: aktualizacja $(date -u +%F)" && git push)

      - name: Przygotuj stronę
        run: |
          mkdir _site
          cp index.html manifest.webmanifest sw.js news.json _site/
          cp -r icons _site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
