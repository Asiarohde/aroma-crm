<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aroma CRM</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#B58A3E">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Aroma CRM">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --gold:#B58A3E; --gold-2:#D9B96E; --gold-3:#F1E2BC; --gold-deep:#8A6726;
  --rose:#E9A9BC; --rose-2:#D77B98; --rose-deep:#B24867; --rose-3:#F8DDE5; --rose-4:#FDF3F6;
  --ink:#3B2B31; --ink-2:#6E5A62; --ink-3:#9C8B92;
  --white:#FFFFFF; --bg:#FFFAFB;
  --line:rgba(181,138,62,.30); --line-soft:rgba(181,138,62,.16);
  --grad-gold:linear-gradient(135deg,#A47A2D 0%,#C9A24F 52%,#A87F32 100%);
  --shadow:0 1px 2px rgba(138,103,38,.07),0 14px 34px -14px rgba(201,107,138,.28);
  --serif:'Cormorant Garamond','Georgia',serif; --sans:'Jost','Segoe UI',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--sans);color:var(--ink);background:
  radial-gradient(900px 500px at 100% -10%,rgba(233,169,188,.26),transparent 60%),
  radial-gradient(700px 420px at -10% 110%,rgba(217,185,110,.20),transparent 60%),var(--bg);
  font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
a{color:var(--gold-deep)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:8px}
.ic{flex:none}
[hidden]{display:none!important}

.app{display:grid;grid-template-columns:270px 1fr;height:100vh}
.side{background:var(--white);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:26px 18px 20px}
.brand{display:flex;gap:13px;align-items:center;padding:0 8px 28px}
.logo{width:46px;height:46px;border-radius:50%;background:var(--grad-gold);display:grid;place-items:center;color:#fff;box-shadow:0 6px 16px -6px rgba(138,103,38,.6), inset 0 0 0 2px rgba(255,255,255,.35)}
.brand-name{font-family:var(--serif);font-size:26px;font-weight:700;line-height:1;color:var(--gold-deep);letter-spacing:.01em}
.brand-sub{font-size:12.5px;color:var(--rose-deep);margin-top:4px;font-weight:500}
nav{display:flex;flex-direction:column;gap:4px}
.nav-i{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;color:var(--ink-2);font-weight:400;text-align:left;width:100%;transition:.18s;position:relative}
.nav-i:hover{background:var(--rose-4);color:var(--ink)}
.nav-i.on{background:linear-gradient(90deg,var(--rose-3),var(--rose-4));color:var(--ink);font-weight:500}
.nav-i.on::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:3px;background:var(--grad-gold)}
.nav-i .n{margin-left:auto;font-size:12px;background:var(--gold-3);color:var(--gold-deep);padding:1px 9px;border-radius:99px;font-weight:500}
.side-foot{margin-top:auto;padding:16px 10px 0;border-top:1px solid var(--line-soft);font-size:12.5px;color:var(--ink-3);line-height:1.5}
.side-foot b{color:var(--gold-deep);font-weight:500}

.main{display:flex;flex-direction:column;min-width:0;height:100vh}
.top{display:flex;align-items:center;gap:18px;padding:22px 34px 16px}
.top h1{font-family:var(--serif);font-size:34px;font-weight:600;color:var(--ink);white-space:nowrap;line-height:1}
.search{flex:1;max-width:560px;margin-left:auto;position:relative}
.search .ic{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--gold)}
.search input{width:100%;padding:13px 44px 13px 46px;border-radius:99px;border:1px solid var(--line);background:#fff;outline:none;transition:.2s;box-shadow:0 1px 0 rgba(181,138,62,.06)}
.search input:focus{border-color:var(--gold);box-shadow:0 0 0 4px rgba(217,185,110,.28)}
.search kbd{position:absolute;right:16px;top:50%;transform:translateY(-50%);font:500 12px var(--sans);color:var(--ink-3);border:1px solid var(--line-soft);border-radius:6px;padding:0 7px}
.view{flex:1;min-height:0;overflow:auto;padding:0 34px 30px}

.btn{display:inline-flex;align-items:center;gap:8px;padding:11px 20px;border-radius:99px;font-weight:500;font-size:14.5px;transition:.18s;white-space:nowrap}
.btn-primary{background:var(--grad-gold);color:#fff;box-shadow:0 8px 18px -8px rgba(138,103,38,.65);text-shadow:0 1px 1px rgba(90,60,10,.25)}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 12px 22px -8px rgba(138,103,38,.7)}
.btn-ghost{border:1px solid var(--line);background:#fff;color:var(--gold-deep)}
.btn-ghost:hover{background:var(--rose-4);border-color:var(--gold)}
.btn-rose{background:linear-gradient(135deg,#E58BA7,#C25C80);color:#fff}
.btn-danger{background:var(--rose-deep);color:#fff}
.btn.sm{padding:8px 15px;font-size:13.5px}
.icon-btn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--ink-2);border:1px solid var(--line-soft);background:#fff;transition:.18s}
.icon-btn:hover{background:var(--rose-4);color:var(--gold-deep);border-color:var(--gold)}
.icon-btn.danger:hover{color:var(--rose-deep);border-color:var(--rose)}
.icon-btn.xs{width:30px;height:30px}

.badge{display:inline-flex;align-items:center;padding:3px 12px;border-radius:99px;font-size:12.5px;font-weight:500}
.b-client{background:var(--gold-3);color:var(--gold-deep)}
.b-partner{background:var(--rose-3);color:var(--rose-deep)}
.b-lead{background:#fff;color:var(--ink-2);border:1px solid var(--line)}
.b-status{background:var(--rose-4);color:var(--ink-2);border:1px solid var(--rose-3)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 11px;border-radius:99px;font-size:12.5px;background:#fff;border:1px solid var(--line);color:var(--gold-deep)}

.av{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;flex:none;font-family:var(--serif);font-weight:700;font-size:19px;color:#fff;text-shadow:0 1px 2px rgba(80,40,40,.3);box-shadow:inset 0 0 0 2px rgba(255,255,255,.45)}
.av-a{background:linear-gradient(135deg,#EBAFC1,#C96B8A)}
.av-b{background:linear-gradient(135deg,#DDBE76,#A97C2F)}
.av-c{background:linear-gradient(135deg,#F0B9A8,#CF7F8E)}
.av-d{background:linear-gradient(135deg,#E3C98C,#CB8FA2)}
.av-lg{width:92px;height:92px;font-size:38px;box-shadow:0 0 0 3px #fff,0 0 0 4.5px var(--gold-2),0 14px 26px -12px rgba(138,103,38,.5)}

.split{display:grid;grid-template-columns:400px 1fr;gap:24px;height:100%;min-height:0}
.listpane{position:relative;background:#fff;border:1px solid var(--line);border-radius:26px;box-shadow:var(--shadow);display:flex;flex-direction:column;min-height:0;overflow:hidden}
.lp-head{padding:18px 20px 12px;border-bottom:1px solid var(--line-soft)}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.fchip{padding:6px 14px;border-radius:99px;font-size:13.5px;color:var(--ink-2);border:1px solid var(--line-soft);background:#fff;transition:.15s}
.fchip:hover{border-color:var(--gold)}
.fchip.on{background:var(--grad-gold);color:#fff;border-color:transparent}
.grp-sel{margin-top:10px;width:100%;padding:8px 14px;border-radius:99px;border:1px solid var(--line);background:#fff;font-size:13.5px;color:var(--ink-2);outline:none}
.grp-sel:focus{border-color:var(--gold);box-shadow:0 0 0 4px rgba(217,185,110,.25)}
.gpick{display:flex;flex-wrap:wrap;gap:8px}
.gp{display:inline-flex;align-items:center;gap:8px;padding:6px 14px;border-radius:99px;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:14px;color:var(--ink-2)!important;font-weight:400!important}
.gp:has(input:checked){background:var(--rose-3);border-color:var(--rose-2);color:var(--rose-deep)!important}
.gp input{width:auto!important;accent-color:#C25C80}
.sortrow{display:flex;align-items:center;justify-content:space-between;margin-top:12px;font-size:13px;color:var(--ink-3)}
.seg{display:inline-flex;background:var(--rose-4);border-radius:99px;padding:3px;border:1px solid var(--rose-3)}
.seg button{padding:3px 13px;border-radius:99px;font-size:13px;color:var(--ink-2)}
.seg button.on{background:#fff;color:var(--gold-deep);box-shadow:0 1px 4px rgba(138,103,38,.2);font-weight:500}
.list-scroll{flex:1;overflow:auto;padding:4px 34px 16px 12px;scroll-behavior:smooth}
.grp-h{position:sticky;top:0;z-index:2;padding:12px 10px 6px;font-family:var(--serif);font-size:24px;font-weight:700;color:var(--gold);background:linear-gradient(#fff 78%,rgba(255,255,255,0))}
.item{display:flex;gap:13px;align-items:center;padding:10px 12px;border-radius:16px;cursor:pointer;border:1px solid transparent;transition:.16s;width:100%;text-align:left}
.item:hover{background:var(--rose-4)}
.item.active{background:linear-gradient(90deg,var(--rose-4),#fff);border-color:var(--gold-2);box-shadow:var(--shadow)}
.item .av{width:42px;height:42px;font-size:17px}
.item .nm{font-weight:500;font-size:15.5px;line-height:1.25}
.item .sb{font-size:13px;color:var(--ink-3);margin-top:2px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--rose-2);box-shadow:0 0 0 3px var(--rose-3);display:inline-block}
.rail{position:absolute;right:7px;top:112px;bottom:12px;display:flex;flex-direction:column;justify-content:center;gap:0}
.rail button{font-size:10.5px;line-height:1.28;color:var(--gold);padding:0 5px;font-weight:600}
.rail button:hover{color:var(--rose-deep);transform:scale(1.35)}
.empty{padding:42px 26px;text-align:center;color:var(--ink-2)}
.empty h3{font-family:var(--serif);font-size:26px;font-weight:600;color:var(--ink);margin-bottom:6px}
.empty .art{width:64px;height:64px;margin:0 auto 14px;border-radius:50%;background:var(--rose-3);display:grid;place-items:center;color:var(--gold)}
.empty .btn{margin-top:16px}

.detailpane{overflow:auto;min-height:0;padding:2px 4px 24px 2px}
.d-wrap{display:flex;flex-direction:column;gap:18px}
.back{display:none;color:var(--gold-deep);font-weight:500;padding:4px 0}
.d-hero{display:flex;gap:22px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:26px;padding:24px 26px;box-shadow:var(--shadow)}
.d-id{flex:1;min-width:0}
.d-id h2{font-family:var(--serif);font-size:40px;font-weight:600;line-height:1.05;margin-bottom:10px;overflow-wrap:anywhere}
.d-meta{display:flex;gap:8px;flex-wrap:wrap}
.d-actions{display:flex;gap:8px;align-items:center}
.last-card{position:relative;display:grid;grid-template-columns:1.5fr 1fr;gap:0;background:linear-gradient(135deg,#fff 40%,var(--rose-4));border:1.5px solid var(--gold-2);border-radius:26px;box-shadow:var(--shadow);overflow:hidden}
.last-card::before{content:"";position:absolute;inset:6px;border:1px solid var(--line-soft);border-radius:21px;pointer-events:none}
.lc-main{padding:26px 30px}
.lc-label{font-size:14px;color:var(--rose-deep);font-weight:500;margin-bottom:6px;display:flex;align-items:center;gap:8px}
.lc-date{font-family:var(--serif);font-size:44px;line-height:1;font-weight:600;color:var(--gold-deep)}
.lc-rel{margin-top:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;color:var(--ink-2)}
.lc-topic{margin-top:16px;padding-left:16px;border-left:3px solid var(--rose);font-family:var(--serif);font-size:21px;line-height:1.3;font-style:italic;color:var(--ink)}
.lc-note{margin-top:8px;font-size:14px;color:var(--ink-2);padding-left:19px}
.lc-side{padding:26px 28px;border-left:1px dashed var(--line);display:flex;flex-direction:column;justify-content:center;gap:10px;background:rgba(255,255,255,.55)}
.lc-side .lbl{font-size:13.5px;color:var(--ink-3)}
.lc-side .val{font-family:var(--serif);font-size:26px;font-weight:600;color:var(--ink);line-height:1.1}
.lc-side .val.late{color:var(--rose-deep)}
.d-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.card{background:#fff;border:1px solid var(--line);border-radius:24px;padding:22px 24px;box-shadow:var(--shadow)}
.card h4{font-family:var(--serif);font-size:23px;font-weight:600;color:var(--gold-deep);margin-bottom:12px}
.card-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.card-h h4{margin:0}
.row{display:flex;gap:12px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line-soft)}
.row:last-child{border-bottom:0}
.row .ic{color:var(--gold);margin-top:2px}
.row .k{font-size:12.5px;color:var(--ink-3);line-height:1.2}
.row .v{font-size:15px;overflow-wrap:anywhere}
.row.none .v{color:var(--ink-3)}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.tl{position:relative;margin-top:10px;padding-left:26px}
.tl::before{content:"";position:absolute;left:7px;top:8px;bottom:8px;width:2px;background:linear-gradient(var(--gold-2),var(--rose))}
.tl-i{position:relative;padding:4px 0 20px}
.tl-i:last-child{padding-bottom:4px}
.tl-i::before{content:"";position:absolute;left:-26px;top:9px;width:16px;height:16px;border-radius:50%;background:#fff;border:3px solid var(--rose-2)}
.tl-i:first-child::before{border-color:var(--gold);background:var(--gold-3)}
.tl-top{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tl-date{font-weight:500}
.tl-topic{margin-top:4px;font-size:16px}
.tl-note{margin-top:3px;font-size:14px;color:var(--ink-2);white-space:pre-wrap}
.tl-tools{margin-left:auto;display:flex;gap:4px;opacity:.0;transition:.15s}
.tl-i:hover .tl-tools,.tl-i:focus-within .tl-tools{opacity:1}
.notes{white-space:pre-wrap;color:var(--ink-2)}
.muted{color:var(--ink-3)}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.stat{background:#fff;border:1px solid var(--line);border-radius:24px;padding:20px 22px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.stat::after{content:"";position:absolute;right:-28px;top:-28px;width:96px;height:96px;border-radius:50%;background:var(--rose-3);opacity:.7}
.stat.g::after{background:var(--gold-3)}
.stat .num{font-family:var(--serif);font-size:48px;font-weight:600;line-height:1;color:var(--gold-deep);position:relative;z-index:1}
.stat .lb{color:var(--ink-2);margin-top:6px;position:relative;z-index:1}
.hello{padding:4px 0 20px}
.hello .big{font-family:var(--serif);font-size:30px;font-weight:500;font-style:italic;color:var(--ink-2)}
.panels{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:20px}
.mini{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:9px 8px;border-radius:14px;transition:.15s}
.mini:hover{background:var(--rose-4)}
.mini .av{width:38px;height:38px;font-size:15px}
.mini .t{font-weight:500;line-height:1.25}
.mini .s{font-size:13px;color:var(--ink-3)}
.mini .s.late{color:var(--rose-deep)}
.welcome{max-width:760px;margin:34px auto;text-align:center;background:#fff;border:1px solid var(--line);border-radius:32px;padding:50px 40px;box-shadow:var(--shadow)}
.welcome h2{font-family:var(--serif);font-size:44px;font-weight:600;color:var(--gold-deep);line-height:1.05}
.welcome p{color:var(--ink-2);margin:14px auto 26px;max-width:520px}
.cta-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

.page{max-width:900px;display:flex;flex-direction:column;gap:18px}
.steps{counter-reset:s;list-style:none;display:flex;flex-direction:column;gap:12px;margin-top:6px}
.steps li{counter-increment:s;position:relative;padding-left:44px}
.steps li::before{content:counter(s);position:absolute;left:0;top:-1px;width:30px;height:30px;border-radius:50%;background:var(--grad-gold);color:#fff;display:grid;place-items:center;font-family:var(--serif);font-size:18px;font-weight:700}
.drop{border:2px dashed var(--gold-2);border-radius:22px;padding:28px;text-align:center;background:var(--rose-4)}
.drop h5{font-family:var(--serif);font-size:23px;font-weight:600;margin-bottom:4px}
.drop p{color:var(--ink-2);margin-bottom:14px;font-size:14px}
.status{margin-top:14px;padding:12px 16px;border-radius:14px;background:var(--gold-3);color:var(--gold-deep)}
.status.err{background:var(--rose-3);color:var(--rose-deep)}
.pv-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:12px 0}
.pv{background:var(--rose-4);border:1px solid var(--rose-3);border-radius:18px;padding:14px 16px}
.pv b{font-family:var(--serif);font-size:32px;color:var(--gold-deep);display:block;line-height:1.1}
.check{display:flex;gap:10px;align-items:flex-start;margin:10px 0;cursor:pointer}
.check input{width:18px;height:18px;margin-top:3px;accent-color:#C25C80}

.modal-wrap{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:20px}
.modal-back{position:absolute;inset:0;background:rgba(59,43,49,.42);backdrop-filter:blur(3px)}
.modal-card{position:relative;background:#fff;border-radius:28px;border:1.5px solid var(--gold-2);width:100%;max-width:700px;max-height:92vh;overflow:auto;padding:28px 30px;box-shadow:0 30px 70px -20px rgba(59,43,49,.5);animation:pop .22s ease-out}
.modal-card.small{max-width:440px}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.modal-head h3{font-family:var(--serif);font-size:30px;font-weight:600;color:var(--gold-deep)}
.modal-foot{display:flex;gap:10px;justify-content:flex-end;margin-top:22px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px}
.fld{display:flex;flex-direction:column;gap:5px}
.fld.full{grid-column:1/-1}
.fld label{font-size:13.5px;color:var(--ink-2);font-weight:500}
.fld input,.fld select,.fld textarea{padding:11px 14px;border-radius:14px;border:1px solid var(--line);background:#fff;outline:none;transition:.15s;width:100%}
.fld textarea{min-height:88px;resize:vertical}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--gold);box-shadow:0 0 0 4px rgba(217,185,110,.25)}
.hint{font-size:12.5px;color:var(--ink-3)}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:12px 22px;border-radius:99px;opacity:0;pointer-events:none;transition:.25s;z-index:80;box-shadow:0 14px 30px -10px rgba(0,0,0,.4)}
#toast.on{opacity:1;transform:translateX(-50%)}

@media (max-width:1180px){.split{grid-template-columns:340px 1fr}.stats{grid-template-columns:repeat(2,1fr)}.panels{grid-template-columns:1fr}.last-card{grid-template-columns:1fr}.lc-side{border-left:0;border-top:1px dashed var(--line)}}
@media (max-width:900px){
  .app{grid-template-columns:1fr;grid-template-rows:1fr auto;height:100dvh}
  .side{order:2;flex-direction:row;padding:8px 10px;border-right:0;border-top:1px solid var(--line)}
  .brand,.side-foot{display:none}
  nav{flex-direction:row;width:100%;justify-content:space-around}
  .nav-i{flex-direction:column;gap:2px;padding:8px 10px;font-size:12px;width:auto}
  .nav-i .n{display:none}.nav-i.on::before{display:none}
  .main{height:auto;min-height:0;overflow:hidden}
  .top{padding:16px 16px 10px;flex-wrap:wrap;gap:10px}.top h1{font-size:28px}
  .search{order:3;max-width:none;flex-basis:100%;margin:0}
  .top .btn-primary{margin-left:auto}
  .view{padding:0 14px 18px}
  .split{grid-template-columns:1fr}
  .split .detailpane{display:none}
  .split.has-detail .listpane{display:none}
  .split.has-detail .detailpane{display:block}
  .back{display:inline-block}
  .d-hero{flex-wrap:wrap}.d-id h2{font-size:32px}.d-grid{grid-template-columns:1fr}
  .stats{grid-template-columns:1fr 1fr}.pv-grid{grid-template-columns:1fr}.form{grid-template-columns:1fr}
  .lc-date{font-size:36px}
}

const ui={view:'dashboard',filter:'all',group:'all',q:'',sort:'last',selectedId:null,imp:null,impMsg:null,newsTab:'today',newsTopic:'aroma',newsLoading:null,newsErr:null};

/* ============ Narzędzia ============ */
const $=(s,r=document)=>r.querySelector(s);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s||'').toLowerCase().replace(/ł/g,'l').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\s+/g,' ').trim();
const fullName=c=>`${c.firstName||''} ${c.lastName||''}`.trim();
function splitName(full){const p=String(full).trim().split(/\s+/).filter(Boolean);if(p.length<=1)return{firstName:p[0]||'',lastName:''};return{firstName:p.slice(0,-1).join(' '),lastName:p[p.length-1]};}
const pad=n=>String(n).padStart(2,'0');
const dstr=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());

const parseD=s=>{const[y,m,d]=String(s).split('-').map(Number);return new Date(y,m-1,d);};

const fmtDate=s=>s?parseD(s).toLocaleDateString('pl-PL',{day:'numeric',month:'long',year:'numeric'}):'brak daty';
function rel(s){
  const n=daysBetween(s,todayStr());
  if(n===0)return'dzisiaj';if(n===1)return'wczoraj';if(n===-1)return'jutro';
  if(n<0)return'za '+(-n)+' dni';
  if(n<31)return n+' dni temu';
  if(n<365)return Math.floor(n/30.4)+' mies. temu';
  const y=Math.floor(n/365);return y+(y===1?' rok temu':y<5?' lata temu':' lat temu');
}
const sortedInter=c=>[...(c.interactions||[])].sort((a,b)=>(b.date||'').localeCompare(a.date||'')||(b.createdAt||0)-(a.createdAt||0));
const lastInter=c=>sortedInter(c)[0]||null;

const avCls=c=>['av-a','av-b','av-c','av-d'][[...fullName(c)].reduce((a,ch)=>a+ch.charCodeAt(0),0)%4];
const safeUrl=u=>/^https?:\/\//i.test(u||'')?u:'';
const blank=()=>({id:uid(),firstName:'',lastName:'',type:'lead',status:'Nowy',phone:'',email:'',city:'',fbUrl:'',birthday:'',melaleucaId:'',interests:'',tags:[],groups:[],notes:'',nextFollowUp:'',source:'manual',fbSince:'',createdAt:Date.now(),interactions:[]});
const collator=new Intl.Collator('pl',{sensitivity:'base'});
const clip=(s,n)=>{s=String(s||'').replace(/\s+/g,' ').trim();return s.length>n?s.slice(0,n-1)+'…':s;};

const ICON={
 search:'<circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/>',

 mail:'<rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/>',

 link:'<path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/>',

 upload:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/>',

 drop:'<path d="M12 2.5c3.5 4.2 6 7.4 6 11a6 6 0 0 1-12 0c0-3.6 2.5-6.8 6-11z"/>',

};
const ic=(n,s=18)=>`<svg class="ic" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[n]}</svg>`;

/* ============ Zapis ============ */
function save(){try{localStorage.setItem(LS_KEY,JSON.stringify(state));}catch(e){toast('Nie udało się zapisać danych w przeglądarce. Pobierz kopię zapasową.');}}
function fixState(p){for(const k of['groups','events','saved','sources'])if(!Array.isArray(p[k]))p[k]=[];return p;}
function load(){try{const r=localStorage.getItem(LS_KEY);if(r){const p=JSON.parse(r);if(p&&Array.isArray(p.contacts))state=fixState(p);}}catch(e){}}
function addGroups(names){
  const have=new Set(state.groups.map(norm));
  for(const n of names){const t=String(n).trim();if(t&&!have.has(norm(t))){state.groups.push(t);have.add(norm(t));}}
  state.groups.sort((a,b)=>collator.compare(a,b));
}

/* ============ Facebook: parsowanie eksportu ============ */
function fixFb(s){
  if(typeof s!=='string')return s;
  for(let i=0;i<s.length;i++)if(s.charCodeAt(i)>255)return s;
  try{return new TextDecoder('utf-8',{fatal:true}).decode(Uint8Array.from(s,ch=>ch.charCodeAt(0)));}catch(e){return s;}
}
function newFbAcc(){return{friends:new Map(),threads:new Map(),groups:new Map(),self:''};}
const isGroupFile=p=>/(^|\/)groups?\/[^/]*\.json$/i.test(p)&&!/post|comment|poll|search|reaction|event|insight|photo|video/i.test(p);
function extractFb(entries){const a=newFbAcc();for(const e of entries)addFbEntry(a,e);return finishFb(a);}
function finishFb(a){return{friends:a.friends,threads:[...a.threads.values()],groups:[...a.groups.values()],self:a.self};}
function addFbEntry(acc,{path,text}){
  const friends=acc.friends,threads=acc.threads;
  {
    let obj;try{obj=JSON.parse(text);}catch(e){return;}
    if(!obj||typeof obj!=='object'||Array.isArray(obj))return;
    if(obj.profile_v2&&obj.profile_v2.name&&obj.profile_v2.name.full_name)acc.self=fixFb(obj.profile_v2.name.full_name);
    if(isGroupFile(path)){
      for(const key of Object.keys(obj)){
        if(!Array.isArray(obj[key]))continue;
        for(const it of obj[key]){
          if(!it||typeof it!=='object')continue;
          const nm=typeof it.name==='string'?it.name:(Array.isArray(it.data)&&it.data[0]&&typeof it.data[0].name==='string'?it.data[0].name:'');
          const t=fixFb(nm).trim();if(t&&!acc.groups.has(norm(t)))acc.groups.set(norm(t),t);
        }
      }
    }
    for(const key of Object.keys(obj)){
      const arr=obj[key];
      if(/^friends(_v\d+)?$/.test(key)&&Array.isArray(arr)){
        for(const f of arr){
          if(!f||typeof f.name!=='string')continue;
          const name=fixFb(f.name).trim();if(!name)continue;
          const k=norm(name);
          if(!friends.has(k))friends.set(k,{name,since:f.timestamp?tsToDate(f.timestamp*1000):''});
        }
      }
    }
    if(Array.isArray(obj.participants)&&Array.isArray(obj.messages)){
      const parts=obj.participants.map(p=>fixFb(p&&p.name)).filter(Boolean);
      const dir=path.replace(/[^/\\]+$/,'');
      const key=dir||[...parts].sort().join('|');
      let t=threads.get(key);
      if(!t){t={key,participants:parts,count:0,first:Infinity,last:0,lastMsg:null};threads.set(key,t);}
      for(const m of obj.messages){
        const ts=m.timestamp_ms;if(typeof ts!=='number')continue;
        t.count++;if(ts<t.first)t.first=ts;
        if(ts>=t.last){
          t.last=ts;
          let txt=typeof m.content==='string'?fixFb(m.content):'';
          if(!txt)txt=m.photos?'[zdjęcie]':m.videos?'[wideo]':m.audio_files?'[nagranie głosowe]':m.sticker?'[naklejka]':m.share?'[udostępniony link]':'[załącznik]';
          t.lastMsg={sender:fixFb(m.sender_name||''),text:txt};
        }
      }
    }
  }
}
function detectSelf(threads){
  const cnt=new Map();
  for(const t of threads)for(const p of new Set(t.participants))cnt.set(p,(cnt.get(p)||0)+1);
  let best='',n=0;for(const[p,c]of cnt)if(c>n){best=p;n=c;}
  return n>=2?best:'';
}
function buildPlan(parsed,selfName,opts){
  const self=norm(selfName);
  const people=new Map();
  for(const f of parsed.friends.values())people.set(norm(f.name),{key:norm(f.name),name:f.name,since:f.since,friend:true,thread:null});
  let groups=0,oneToOne=0;
  for(const t of parsed.threads){
    if(t.participants.length!==2){groups++;continue;}
    const others=t.participants.filter(p=>norm(p)!==self);
    if(!self||others.length!==1){continue;}
    const name=others[0];
    if(/^(facebook user|użytkownik facebooka|uzytkownik facebooka)$/i.test(name))continue;
    oneToOne++;
    const k=norm(name);
    let p=people.get(k);
    if(!p){p={key:k,name,since:'',friend:false,thread:null};people.set(k,p);}
    p.thread=t;
  }
  const existing=new Set(state.contacts.map(c=>norm(fullName(c))));
  const list=[...people.values()].filter(p=>p.friend||opts.addMessenger||existing.has(p.key));
  const fresh=list.filter(p=>!existing.has(p.key)).length;
  return{people:list,fresh,known:list.length-fresh,groups,oneToOne,friends:parsed.friends.size};
}
function applyImport(){
  const imp=ui.imp;if(!imp)return;
  const plan=buildPlan(imp.parsed,imp.self,{addMessenger:imp.addMessenger});
  const idx=new Map(state.contacts.map(c=>[norm(fullName(c)),c]));
  const grpBefore=state.groups.length;addGroups(imp.parsed.groups||[]);const grpAdded=state.groups.length-grpBefore;
  let added=0,touched=0;
  for(const p of plan.people){
    let c=idx.get(p.key);
    if(!c){
      const nm=splitName(p.name);
      c=Object.assign(blank(),nm,{source:p.friend?'facebook':'messenger',fbSince:p.since||''});
      state.contacts.push(c);idx.set(p.key,c);added++;
    }else if(p.since&&!c.fbSince)c.fbSince=p.since;
    if(p.thread){
      const t=p.thread,ik='msgr:'+t.key;
      const date=tsToDate(t.last);
      const topic=t.lastMsg?`Ostatnia wiadomość: „${clip(t.lastMsg.text,140)}”`:'Rozmowa na Messengerze';
      const note=`Zaimportowane z Messengera. Wiadomości w rozmowie: ${t.count}, pierwsza z ${fmtDate(tsToDate(t.first))}.${t.lastMsg&&t.lastMsg.sender?' Ostatnią wiadomość napisał(a): '+t.lastMsg.sender+'.':''}`;
      let it=(c.interactions||[]).find(i=>i.importKey===ik);
      if(!it){c.interactions.push({id:uid(),importKey:ik,date,channel:'Messenger',topic,notes:note,createdAt:Date.now()});touched++;}
      else if(!it.edited&&it.date!==date){it.date=date;it.topic=topic;it.notes=note;touched++;}
    }
  }
  save();
  ui.imp=null;ui.impMsg={ok:true,text:`Gotowe. Nowych kontaktów: ${added}, rozmów z Messengera dopisanych lub odświeżonych: ${touched}, nowych grup: ${grpAdded}.`};
  toast('Import zakończony');renderAll();
}

/* ============ CSV ============ */
function parseCSV(text){
  text=text.replace(/^﻿/,'');
  const first=text.split(/\r?\n/)[0]||'';
  const delim=(first.match(/;/g)||[]).length>(first.match(/,/g)||[]).length?';':',';
  const rows=[];let row=[],cur='',q=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(q){if(ch==='"'){if(text[i+1]==='"'){cur+='"';i++;}else q=false;}else cur+=ch;}
    else if(ch==='"')q=true;
    else if(ch===delim){row.push(cur);cur='';}
    else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&text[i+1]==='\n')i++;row.push(cur);cur='';if(row.some(x=>x.trim()!==''))rows.push(row);row=[];}
    else cur+=ch;
  }
  row.push(cur);if(row.some(x=>x.trim()!==''))rows.push(row);
  return rows;
}
function csvToContacts(rows){
  if(rows.length<2)return[];
  const h=rows[0].map(norm);
  const f=re=>h.findIndex(x=>re.test(x));
  const iF=f(/^(imie|first name|given name|firstname)/),iL=f(/^(nazwisko|last name|family name|surname|lastname)/),iN=f(/^(name|imie i nazwisko|full name|nazwa|display name)$/);
  const iP=f(/(telefon|phone|mobile|komorka)/),iE=f(/e-?mail/),iC=f(/(miasto|city)/),iNo=f(/(notatk|notes|uwagi)/);
  const out=[];
  for(const r of rows.slice(1)){
    let fn='',ln='';
    if(iF>=0||iL>=0){fn=(r[iF]||'').trim();ln=(r[iL]||'').trim();}
    else if(iN>=0){const s=splitName(r[iN]||'');fn=s.firstName;ln=s.lastName;}
    if(!fn&&!ln)continue;
    out.push(Object.assign(blank(),{firstName:fn,lastName:ln,phone:(r[iP]||'').trim(),email:(r[iE]||'').trim(),city:(r[iC]||'').trim(),notes:(r[iNo]||'').trim(),source:'csv'}));
  }
  return out;
}

function visible(){
  const q=norm(ui.q),qd=q.replace(/\s/g,'');
  return state.contacts.filter(c=>{
    if(ui.filter!=='all'&&c.type!==ui.filter)return false;
    if(ui.group!=='all'&&!(c.groups||[]).includes(ui.group))return false;
    if(!q)return true;
    if(norm(fullName(c)).includes(q)||norm((c.lastName||'')+' '+(c.firstName||'')).includes(q))return true;
    if(qd.length>=3&&/\d/.test(qd)&&(c.phone||'').replace(/\s/g,'').includes(qd))return true;
    if(q.includes('@')&&norm(c.email).includes(q))return true;
    return false;
  });
}
const sortStr=c=>ui.sort==='last'?`${c.lastName||c.firstName||''} ${c.firstName||''}`:`${c.firstName||c.lastName||''} ${c.lastName||''}`;
function letterOf(c){const s=(ui.sort==='last'?(c.lastName||c.firstName):(c.firstName||c.lastName))||'';const ch=s.trim().charAt(0).toUpperCase();return /\p{L}/u.test(ch)?ch:'#';}
function renderList(){
  const host=$('#listScroll');if(!host)return;
  const all=state.contacts;
  const cnt=t=>all.filter(c=>c.type===t).length;
  $('#filters').innerHTML=[['all','Wszyscy',all.length],['client','Klienci',cnt('client')],['partner','Partnerzy',cnt('partner')],['lead','Z Facebooka',cnt('lead')]].map(([k,l,n])=>`<button class="fchip ${ui.filter===k?'on':''}" data-act="filter" data-f="${k}">${l} ${n}</button>`).join('');
  if(ui.group!=='all'&&!state.groups.includes(ui.group))ui.group='all';
  $('#grpSel').innerHTML=state.groups.length?`<select id="grpFilter" class="grp-sel" aria-label="Filtr grupy na Facebooku"><option value="all">Wszystkie moje grupy</option>${state.groups.map(g=>`<option value="${esc(g)}" ${g===ui.group?'selected':''}>${esc(g)}</option>`).join('')}</select>`:'';
  document.querySelectorAll('.seg button').forEach(b=>b.classList.toggle('on',b.dataset.s===ui.sort));
  const list=visible().sort((a,b)=>collator.compare(sortStr(a),sortStr(b)));
  $('#count').textContent=ui.q?`Znaleziono: ${list.length}`:`Osób na liście: ${list.length}`;
  if(!list.length){
    $('#rail').innerHTML='';
    host.innerHTML=all.length?`<div class="empty"><div class="art">${ic('search',28)}</div><h3>Nikogo nie znaleziono</h3><p>Sprawdź pisownię albo zmień filtr.</p></div>`
      :`<div class="empty"><div class="art">${ic('users',28)}</div><h3>Lista jest pusta</h3><p>Dodaj pierwszy kontakt albo zaimportuj znajomych z Facebooka.</p><button class="btn btn-primary" data-act="new-contact">Dodaj kontakt</button></div>`;

  }
  const groups=[];let cur=null;

  const hi=groups.findIndex(g=>g.L==='#');if(hi>=0&&hi!==groups.length-1)groups.push(groups.splice(hi,1)[0]);

  $('#rail').innerHTML=groups.map(g=>`<button data-act="jump" data-l="${esc(g.L)}" aria-label="Przejdź do litery ${esc(g.L)}">${esc(g.L)}</button>`).join('');
}

/* Czytnik ZIP dla dużych paczek: czyta spis treści i tylko potrzebne pliki JSON (bez ładowania całego archiwum do pamięci) */
async function zipList(file){
  const size=file.size,tailLen=Math.min(size,65557);
  const tail=new DataView(await file.slice(size-tailLen,size).arrayBuffer());
  let eocd=-1;
  for(let i=tailLen-22;i>=0;i--)if(tail.getUint32(i,true)===0x06054b50){eocd=i;break;}
  if(eocd<0)throw new Error('To nie wygląda na poprawny plik ZIP: '+file.name);
  let total=tail.getUint16(eocd+10,true),cdSize=tail.getUint32(eocd+12,true),cdOff=tail.getUint32(eocd+16,true);
  if(total===0xFFFF||cdSize===0xFFFFFFFF||cdOff===0xFFFFFFFF){
    const locAt=eocd-20;
    if(locAt<0||tail.getUint32(locAt,true)!==0x07064b50)throw new Error('Nieobsługiwany format ZIP64: '+file.name);
    const z64Off=Number(tail.getBigUint64(locAt+8,true));
    const z=new DataView(await file.slice(z64Off,z64Off+56).arrayBuffer());
    if(z.getUint32(0,true)!==0x06064b50)throw new Error('Uszkodzony nagłówek ZIP64: '+file.name);
    total=Number(z.getBigUint64(32,true));cdSize=Number(z.getBigUint64(40,true));cdOff=Number(z.getBigUint64(48,true));
  }
  const cd=new DataView(await file.slice(cdOff,cdOff+cdSize).arrayBuffer());
  const dec=new TextDecoder('utf-8'),out=[];let p=0;
  while(p+46<=cd.byteLength&&cd.getUint32(p,true)===0x02014b50){
    const method=cd.getUint16(p+10,true);
    let comp=cd.getUint32(p+20,true),unc=cd.getUint32(p+24,true);
    const nl=cd.getUint16(p+28,true),el=cd.getUint16(p+30,true),cl=cd.getUint16(p+32,true);
    let off=cd.getUint32(p+42,true);
    const name=dec.decode(new Uint8Array(cd.buffer,cd.byteOffset+p+46,nl));
    if(comp===0xFFFFFFFF||unc===0xFFFFFFFF||off===0xFFFFFFFF){
      let q=p+46+nl;const end=q+el;
      while(q+4<=end){
        const id=cd.getUint16(q,true),len=cd.getUint16(q+2,true);
        if(id===1){
          let r=q+4;
          if(unc===0xFFFFFFFF){unc=Number(cd.getBigUint64(r,true));r+=8;}
          if(comp===0xFFFFFFFF){comp=Number(cd.getBigUint64(r,true));r+=8;}
          if(off===0xFFFFFFFF){off=Number(cd.getBigUint64(r,true));r+=8;}
        }
        q+=4+len;
      }
    }
    out.push({name,method,comp,unc,off,dir:name.endsWith('/')});
    p+=46+nl+el+cl;
  }
  return out;
}
async function zipReadText(file,e){
  const h=new DataView(await file.slice(e.off,e.off+30).arrayBuffer());
  if(h.getUint32(0,true)!==0x04034b50)throw new Error('Uszkodzony wpis w ZIP: '+e.name);
  const start=e.off+30+h.getUint16(26,true)+h.getUint16(28,true);
  const blob=file.slice(start,start+e.comp);
  if(e.method===0)return await blob.text();
  if(e.method!==8)throw new Error('Nieobsługiwana kompresja w ZIP: '+e.name);
  if(typeof DecompressionStream==='undefined')throw new Error('Ta przeglądarka nie obsługuje dużych plików ZIP. Użyj Chrome, Edge lub Safari w nowszej wersji albo rozpakuj paczkę i wybierz folder.');
  return await new Response(blob.stream().pipeThrough(new DecompressionStream('deflate-raw'))).text();
}
const tick=()=>new Promise(r=>setTimeout(r,0));
async function collectEntries(files,onEntry,onProgress){
  let k=0;
  for(const f of files){
    k++;
    const path=f.webkitRelativePath||f.name;
    if(/\.zip$/i.test(f.name)){
      if(onProgress)onProgress(`Czytam plik ${k} z ${files.length}: ${f.name}…`);
      await tick();
      const list=await zipList(f);
      let n=0;
      for(const e of list){
        if(e.dir||!/\.json$/i.test(e.name)||!relevantPath(e.name))continue;
        onEntry({path:e.name,text:await zipReadText(f,e)});
        if(++n%25===0){if(onProgress)onProgress(`Czytam plik ${k} z ${files.length}: ${f.name} (przeczytano ${n} plików z danymi)…`);await tick();}
      }
    }else if(/\.json$/i.test(f.name)&&relevantPath(path)){
      onEntry({path,text:await f.text()});
    }
  }
}
async function handleImport(files){
  ui.impMsg={ok:true,text:'Czytam pliki, to może chwilę potrwać…'};renderView();

const NEWS_TOPICS=[
 {k:'aroma',l:'Aromaterapia',q:'aromatherapy[Title/Abstract]'},
 {k:'eo',l:'Olejki eteryczne',q:'"essential oil"[Title/Abstract] OR "essential oils"[Title/Abstract]'},

 {k:'sleep',l:'Sen i stres',q:'(aromatherapy[Title/Abstract] OR lavender[Title/Abstract]) AND (sleep[Title/Abstract] OR anxiety[Title/Abstract] OR stress[Title/Abstract])'},
 {k:'skin',l:'Skóra',q:'("essential oil"[Title/Abstract] OR aromatherapy[Title/Abstract]) AND (skin[Title/Abstract] OR dermatitis[Title/Abstract] OR acne[Title/Abstract])'}
];
const NEWS_KEY='aromaCRM.news.v1';
const EU='https://eutils.ncbi.nlm.nih.gov/entrez/eutils/';
let newsCache={date:'',topics:{}};
function loadNewsCache(){try{const r=JSON.parse(localStorage.getItem(NEWS_KEY)||'null');newsCache=(r&&r.date===todayStr()&&r.topics)?r:{date:todayStr(),topics:{}};}catch(e){newsCache={date:todayStr(),topics:{}};}}
function saveNewsCache(){try{localStorage.setItem(NEWS_KEY,JSON.stringify(newsCache));}catch(e){}}
const PL_MON=['sty','lut','mar','kwi','maj','cze','lip','sie','wrz','paź','lis','gru'];
const EN_MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const PT_PL={'Randomized Controlled Trial':'badanie RCT','Systematic Review':'przegląd systematyczny','Meta-Analysis':'metaanaliza','Review':'przegląd','Clinical Trial':'badanie kliniczne','Case Reports':'opis przypadku'};
function parsePubmedXml(text){
  const doc=new DOMParser().parseFromString(text,'text/xml');
  const first=(el,tag)=>{if(!el)return null;const l=el.getElementsByTagName(tag);return l.length?l[0]:null;};
  const txt=n=>n?String(n.textContent||'').replace(/\s+/g,' ').trim():'';
  const out=[],arts=doc.getElementsByTagName('PubmedArticle');
  for(let i=0;i<arts.length;i++){
    const a=arts[i];
    const pmid=txt(first(first(a,'MedlineCitation'),'PMID'));if(!pmid)continue;
    const src=first(a,'ArticleDate')||first(first(a,'JournalIssue'),'PubDate');
    const y=txt(first(src,'Year')),mo=txt(first(src,'Month')),d=txt(first(src,'Day'));
    const mi=/^\d+$/.test(mo)?+mo-1:EN_MON.indexOf(mo.slice(0,3));
    const date=[d,mi>=0?PL_MON[mi]:'',y].filter(Boolean).join(' ')||txt(first(src,'MedlineDate'));
    const absN=a.getElementsByTagName('AbstractText'),abs=[];
    for(let j=0;j<absN.length;j++){const l=absN[j].getAttribute('Label');abs.push((l?l+': ':'')+txt(absN[j]));}
    const au=a.getElementsByTagName('Author'),names=[];
    for(let j=0;j<au.length&&names.length<3;j++){const ln=txt(first(au[j],'LastName'));if(ln)names.push(ln+' '+txt(first(au[j],'Initials')));}
    const pts=a.getElementsByTagName('PublicationType'),types=[];
    for(let j=0;j<pts.length;j++){const p=PT_PL[txt(pts[j])];if(p&&!types.includes(p))types.push(p);}
    out.push({pmid,title:txt(first(a,'ArticleTitle')),journal:txt(first(a,'ISOAbbreviation'))||txt(first(first(a,'Journal'),'Title')),date,authors:names.length?names.join(', ')+(au.length>3?' i in.':''):'',abstract:abs.join('\n'),types});
  }
  return out;
}
async function pubmedFetch(query){
  let ids=[];
  for(const rd of[45,0]){
    const r=await fetch(`${EU}esearch.fcgi?db=pubmed&retmode=json&retmax=10&sort=date&tool=aroma-crm&term=${encodeURIComponent(query)}${rd?`&datetype=edat&reldate=${rd}`:''}`);
    if(!r.ok)throw new Error('PubMed '+r.status);
    const j=await r.json();ids=(j.esearchresult&&j.esearchresult.idlist)||[];
    if(ids.length>=5)break;
  }
  if(!ids.length)return[];
  const r=await fetch(`${EU}efetch.fcgi?db=pubmed&retmode=xml&tool=aroma-crm&id=${ids.join(',')}`);
  if(!r.ok)throw new Error('PubMed '+r.status);
  return parsePubmedXml(await r.text());
}

  const upd=newsFile.updatedAt?fmtDate(newsFile.updatedAt.slice(0,10)):'';
  const noPl=fresh.every(a=>!a.summaryPl);
  return `<p style="color:var(--ink-2);margin-bottom:16px;max-width:70ch">Wybrane dla Ciebie badania z PubMed i wpisy Instytutu Aromaterapii, streszczone po polsku${upd?'. Ostatnia aktualizacja: '+esc(upd):''}. To materiał do nauki, nie zalecenia zdrowotne.</p>

function todayHtml(){
  const k=ui.newsTopic,T=NEWS_TOPICS.find(x=>x.k===k)||NEWS_TOPICS[0];
  const chips=`<div class="filters" style="margin-bottom:14px">${NEWS_TOPICS.map(t=>`<button class="fchip ${t.k===k?'on':''}" data-act="news-topic" data-k="${t.k}">${t.l}</button>`).join('')}</div>`;
  const head='<p style="color:var(--ink-2);margin-bottom:16px;max-width:70ch">Najnowsze publikacje naukowe z PubMed (po angielsku). Lista pobiera się na żywo przy otwarciu zakładki i odświeża raz dziennie. To materiał do nauki, nie zalecenia zdrowotne.</p>';
  const list=newsCache.topics[k];let body='';
  if(ui.newsLoading===k)body='<div class="card"><p class="muted">Pobieram najnowsze artykuły z PubMed…</p></div>';
  else if(ui.newsErr&&ui.newsErr.k===k)body=`<div class="status err">${esc(ui.newsErr.msg)}<div style="margin-top:10px;display:flex;gap:10px;flex-wrap:wrap;align-items:center"><button class="btn btn-ghost sm" data-act="news-refresh">Spróbuj ponownie</button><a href="https://pubmed.ncbi.nlm.nih.gov/?term=${encodeURIComponent(T.q)}&sort=date" target="_blank" rel="noopener noreferrer">Otwórz to wyszukiwanie w PubMed</a></div></div>`;
  else if(list&&!list.length)body='<div class="card"><p class="muted">PubMed nie zwrócił artykułów dla tego tematu.</p></div>';
  else if(list){
    const pool=list.filter(a=>a.abstract).length?list.filter(a=>a.abstract):list;
    const day=Math.floor((new Date()-new Date(new Date().getFullYear(),0,0))/864e5),pick=pool[day%pool.length];
    body=`<div class="feat-l">Wybór na dziś</div>${newsCard(pick,true)}<div class="card-h" style="margin:24px 0 12px"><h4>Pozostałe najnowsze</h4><button class="btn btn-ghost sm" data-act="news-refresh">Odśwież</button></div>${list.filter(a=>a!==pick).map(a=>newsCard(a,false)).join('')}`;
  }
  return chips+head+body;
}

document.addEventListener('submit',e=>{
  const form=e.target.closest('form[data-form]');if(!form)return;e.preventDefault();
  const raw=new FormData(form);
  const fd=Object.fromEntries(raw.entries());
  if(form.dataset.form==='addgroup'){
    const names=(fd.name||'').split(',').map(s=>s.trim()).filter(Boolean);
    if(!names.length)return;
    addGroups(names);save();toast('Grupa dodana');renderAll();return;
  }
  if(form.dataset.form==='addsource'){
    let u=(fd.url||'').trim();const n=(fd.name||'').trim();if(!u||!n)return;
    if(!/^https?:\/\//i.test(u))u='https://'+u;
    try{new URL(u);}catch(err){toast('Ten adres wygląda niepoprawnie');return;}
    state.sources.push({id:uid(),name:n,url:u});save();toast('Źródło dodane');renderView();return;
  }
  if(form.dataset.form==='event'){
    let ev=form.dataset.id?state.events.find(x=>x.id===form.dataset.id):null;
    if(!ev){ev={id:uid(),done:false};state.events.push(ev);}
    const who=(fd.who||'').trim(),k=state.contacts.find(x=>norm(fullName(x))===norm(who));
    Object.assign(ev,{date:fd.date,time:fd.time||'',who:k?'':who,contactId:k?k.id:'',type:fd.type,topic:(fd.topic||'').trim(),notes:(fd.notes||'').trim()});
    const d=parseD(fd.date);ui.cal={y:d.getFullYear(),m:d.getMonth(),sel:fd.date};
    save();closeModal(true);toast('Spotkanie zapisane');renderAll();return;
  }
  if(form.dataset.form==='contact'){
    let c=form.dataset.id?byId(form.dataset.id):null;
    if(!c){c=blank();state.contacts.push(c);}
    let fb=(fd.fbUrl||'').trim();if(fb&&!/^https?:\/\//i.test(fb))fb='https://'+fb;
    Object.assign(c,{firstName:fd.firstName.trim(),lastName:(fd.lastName||'').trim(),type:fd.type,status:fd.status,phone:fd.phone.trim(),email:fd.email.trim(),city:fd.city.trim(),fbUrl:fb,melaleucaId:fd.melaleucaId.trim(),birthday:fd.birthday,nextFollowUp:fd.nextFollowUp,interests:fd.interests.trim(),notes:fd.notes.trim(),tags:(fd.tags||'').split(',').map(s=>s.trim()).filter(Boolean)});
    const newG=(fd.newGroups||'').split(',').map(s=>s.trim()).filter(Boolean);
    addGroups(newG);
    const pick=new Set([...raw.getAll('grp'),...newG].map(norm));
    c.groups=state.groups.filter(g=>pick.has(norm(g)));
    save();ui.selectedId=c.id;ui.view='contacts';closeModal(true);toast('Kontakt zapisany');renderAll();
  }else{
    const c=byId(form.dataset.cid);if(!c)return;
    if(form.dataset.iid){const it=c.interactions.find(i=>i.id===form.dataset.iid);if(it){Object.assign(it,{date:fd.date,channel:fd.channel,topic:fd.topic.trim(),notes:fd.notes.trim(),edited:true});}}
    else{c.interactions.push({id:uid(),date:fd.date,channel:fd.channel,topic:fd.topic.trim(),notes:fd.notes.trim(),createdAt:Date.now()});c.nextFollowUp=fd.nextFollowUp||'';}
    if(c.status==='Nowy')c.status='W rozmowie';
    save();closeModal(true);toast('Wpis zapisany');renderAll();
  }
});

    case'grp-del':if(await askConfirm('Usunąć grupę?',`Grupa „${el.dataset.g}” zniknie z listy i z kart wszystkich osób. Same kontakty zostaną.`)){const g=el.dataset.g;state.groups=state.groups.filter(x=>x!==g);state.contacts.forEach(c=>{c.groups=(c.groups||[]).filter(x=>x!==g);});save();renderAll();}break;
    case'new-contact':contactForm(null);break;
    case'edit-contact':if(c)contactForm(c);break;
    case'del-contact':if(c&&await askConfirm('Usunąć kontakt?',`${fullName(c)} i cała historia rozmów zostaną usunięte. Tej operacji nie da się cofnąć.`)){state.contacts=state.contacts.filter(x=>x.id!==c.id);ui.selectedId=null;save();toast('Kontakt usunięty');renderAll();}break;
    case'select':ui.selectedId=el.dataset.id;renderList();renderDetail();$('#split').classList.add('has-detail');break;
    case'open':ui.view='contacts';ui.selectedId=el.dataset.id;ui.q='';$('#q').value='';renderAll();break;
    case'back':ui.selectedId=null;renderAll();break;
    case'filter':ui.filter=el.dataset.f;renderList();break;
    case'sort':ui.sort=el.dataset.s;renderList();break;
    case'jump':{const g=document.getElementById('grp-'+el.dataset.l);if(g)$('#listScroll').scrollTo({top:g.offsetTop-4});break;}
    case'log':if(c)interForm(c,null);break;
    case'cal-day':{const d=el.dataset.d,p=parseD(d);ui.cal.sel=d;ui.cal.y=p.getFullYear();ui.cal.m=p.getMonth();ui.view='calendar';renderAll();break;}
    case'cal-prev':ui.cal.m--;if(ui.cal.m<0){ui.cal.m=11;ui.cal.y--;}renderView();break;
    case'cal-next':ui.cal.m++;if(ui.cal.m>11){ui.cal.m=0;ui.cal.y++;}renderView();break;
    case'cal-today':{const n=new Date();ui.cal={y:n.getFullYear(),m:n.getMonth(),sel:todayStr()};renderView();break;}
    case'ev-new':eventForm(null);break;
    case'ev-for':if(c)eventForm(null,{who:fullName(c),date:todayStr()});break;
    case'ev-edit':{const e=state.events.find(x=>x.id===el.dataset.id);if(e)eventForm(e);break;}
    case'ev-del':if(await askConfirm('Usunąć spotkanie?','Spotkanie zniknie z kalendarza.')){state.events=state.events.filter(x=>x.id!==el.dataset.id);save();renderAll();}break;
    case'ev-log':{const e=state.events.find(x=>x.id===el.dataset.id),k=e&&byId(e.contactId);if(k){k.interactions.push({id:uid(),date:e.date,channel:e.type||'Spotkanie',topic:e.topic||'Spotkanie',notes:e.notes||'',createdAt:Date.now()});e.done=true;save();toast('Zapisano w historii kontaktu');renderAll();}break;}
    case'news-tab':ui.newsTab=el.dataset.t;renderView();break;
    case'news-topic':ui.newsTopic=el.dataset.k;renderView();break;
    case'news-refresh':delete newsCache.topics[ui.newsTopic];saveNewsCache();ui.newsErr=null;renderView();break;
    case'news-save':{const a=findNews(el.dataset.pmid);if(a&&!state.saved.some(s=>s.pmid===a.pmid)){state.saved.push(Object.assign({},a,{note:'',savedAt:Date.now()}));save();toast('Zapisano w Twojej bazie wiedzy');renderView();}break;}
    case'news-del':{const s=state.saved.find(x=>x.pmid===el.dataset.pmid);if(s&&(!s.note||await askConfirm('Usunąć z bazy wiedzy?','Razem z artykułem zniknie Twoja notatka.'))){state.saved=state.saved.filter(x=>x.pmid!==s.pmid);save();renderView();}break;}
    case'src-del':state.sources=state.sources.filter(x=>x.id!==el.dataset.id);save();renderView();break;
    case'edit-inter':if(c)interForm(c,c.interactions.find(i=>i.id===el.dataset.iid));break;
    case'del-inter':if(c&&await askConfirm('Usunąć wpis?','Ten wpis zniknie z historii kontaktów.')){c.interactions=c.interactions.filter(i=>i.id!==el.dataset.iid);save();renderAll();}break;
    case'fu-done':if(c){c.nextFollowUp='';save();renderAll();toast('Przypomnienie wyczyszczone');}break;
    case'close-modal':closeModal();break;
    case'pick-zip':$('#fileZip').click();break;
    case'pick-dir':$('#fileDir').click();break;
    case'pick-csv':$('#fileCsv').click();break;
    case'pick-restore':$('#fileRestore').click();break;
    case'import-reset':ui.imp=null;renderView();break;
    case'import-apply':applyImport();break;
    case'export-json':download('aroma-crm-kopia-'+todayStr()+'.json',JSON.stringify(state,null,1),'application/json');toast('Kopia pobrana');break;
    case'export-csv':exportCsv();break;
    case'demo-load':loadDemo();break;
    case'demo-clear':state.contacts=state.contacts.filter(x=>!x.demo);ui.selectedId=null;save();toast('Dane przykładowe usunięte');renderAll();break;
  }
});
document.addEventListener('change',async e=>{
  const t=e.target;
  if(t.id==='fileZip'||t.id==='fileDir'){if(t.files.length)await handleImport(t.files);t.value='';}
  else if(t.id==='fileCsv'&&t.files[0]){
    const list=csvToContacts(parseCSV(await t.files[0].text()));t.value='';
    if(!list.length){ui.impMsg={ok:false,text:'Nie znalazłam w pliku kolumn z imieniem i nazwiskiem.'};renderView();return;}
    const have=new Set(state.contacts.map(c=>norm(fullName(c)))),add=list.filter(c=>!have.has(norm(fullName(c))));
    state.contacts.push(...add);save();ui.impMsg={ok:true,text:`Dodano ${add.length} kontaktów z pliku CSV, pominięto duplikaty: ${list.length-add.length}.`};renderAll();
  }
  else if(t.id==='fileRestore'&&t.files[0]){
    try{
      const p=JSON.parse(await t.files[0].text());if(!p||!Array.isArray(p.contacts))throw new Error();
      fixState(p);
      if(await askConfirm('Wczytać kopię?',`Obecne dane (${state.contacts.length} kontaktów) zostaną zastąpione kopią (${p.contacts.length} kontaktów).`,'Wczytaj kopię')){state=p;ui.selectedId=null;save();toast('Kopia wczytana');renderAll();}
    }catch(err){toast('To nie wygląda na kopię zapasową Aroma CRM');}
    t.value='';
  }
  else if(t.id==='impAddM'&&ui.imp){ui.imp.addMessenger=t.checked;renderView();}
  else if(t.id==='grpFilter'){ui.group=t.value;renderList();}
  else if(t.classList&&t.classList.contains('kn')){const s=state.saved.find(x=>x.pmid===t.dataset.pmid);if(s){s.note=t.value;save();toast('Notatka zapisana');}}
});
document.addEventListener('input',e=>{
  if(e.target.id==='q'){
    ui.q=e.target.value;
    if(ui.view!=='contacts'){ui.view='contacts';ui.selectedId=null;renderAll();}else renderList();
  }else if(e.target.id==='impSelf'&&ui.imp){
    ui.imp.self=e.target.value;clearTimeout(input_t);input_t=setTimeout(()=>{const pos=e.target.selectionStart;renderView();const n=$('#impSelf');if(n){n.focus();n.setSelectionRange(pos,pos);}},350);
  }
});
let input_t;
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&!$('#modal').hidden)closeModal();
  if(e.key==='/'&&!/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)&&$('#modal').hidden){e.preventDefault();$('#q').focus();}
});

if(typeof document!=='undefined'){
  load();loadNewsCache();renderAll();
  if('serviceWorker' in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
</body>
</html>
